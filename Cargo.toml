[package]
name = "jj-menu"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A simple TUI menu launcher. Press `jj` and Enter to pick and run a command."
authors = ["Cyberneura"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/cyberneura/jj-menu"
homepage = "https://github.com/cyberneura/jj-menu"
documentation = "https://docs.rs/jj-menu"
keywords = ["tui", "menu", "launcher", "cli", "terminal"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/dist", "/skills"]

[[bin]]
name = "jj-menu"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
# Only for restoring the terminal from a signal handler (src/signal.rs),
# which needs tcsetattr / write / raise rather than anything that locks.
libc = "0.2.180"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
toml = "1.1.4"
# Rows are laid out in terminal columns, and a CJK character takes two of them.
# Counting `char`s instead wraps the highlighted row onto a second line.
unicode-segmentation = "1.12.0"
unicode-width = "0.2.2"

[profile.release]
strip = true
lto = true
codegen-units = 1

# cargo-dist builds with this profile, and names it whether or not it exists:
# without it the release build stops at `profile `dist` is not defined` before
# it compiles anything. It inherits the release profile so a released binary is
# the one the release profile describes.
[profile.dist]
inherits = "release"
